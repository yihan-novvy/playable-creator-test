<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Tasty Travels: Merge Game</title>
  <style>
    :root { --tasty-hud-space: 0px; --tasty-cta-space: 120px; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #43388b; }
    #origin-game { position: fixed; inset: 0; overflow: hidden; }
    #GameCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #splash { position: fixed; inset: 0; z-index: 15; color: white; background: #43388b; font: 16px/1.4 Arial, sans-serif; }
    #splash .loading-logo { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: min(70%, 400px); max-height: 36%; object-fit: contain; }
    #splash .loading-status { position: absolute; top: 66%; left: 0; width: 100%; margin: 0; text-align: center; }
    #splash .progress-bar { position: absolute; left: 27.5%; top: 74%; width: 45%; height: 10px; padding: 2px; border-radius: 7px; overflow: hidden; background: #2d255f; box-shadow: 0 1px 5px #0008 inset, 0 1px 0 #ffffff30; }
    #splash .progress-bar::before, #splash .progress-bar span { background-image: linear-gradient(135deg, #ffffff30 25%, transparent 25%, transparent 50%, #ffffff30 50%, #ffffff30 75%, transparent 75%, transparent); background-size: 30px 30px; animation: tasty-loading-stripes 1s linear infinite; }
    #splash .progress-bar::before { content: ''; position: absolute; inset: 2px; border-radius: 5px; opacity: .35; }
    #splash .progress-bar span { position: relative; display: block; width: 0; height: 100%; border-radius: 5px; background-color: #3dc5de; box-shadow: 0 1px 0 #ffffff80 inset; transition: width .4s ease-in-out; }
    @keyframes tasty-loading-stripes { from { background-position: 0 0; } to { background-position: 60px 0; } }
    @media (prefers-reduced-motion: reduce) { #splash .progress-bar::before, #splash .progress-bar span { animation: none; transition: none; } }
    #novvy-cta:not(.novvy-cta-takeover) { padding: 12px 14px max(14px, env(safe-area-inset-bottom)); }
    #novvy-cta .novvy-cta-icon img { object-fit: contain; }
    #novvy-cta .novvy-cta-name { white-space: normal; }
    #tasty-result { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 124px 20px 140px; box-sizing: border-box; background: #211840b8; color: #fff; text-align: center; font: 700 20px/1.4 Arial, sans-serif; }
    #tasty-result[hidden] { display: none; }
    .tasty-result-card { width: min(100%, 300px); box-sizing: border-box; padding: 28px 20px; border: 2px solid #f6d992; border-radius: 22px; background: #534095; box-shadow: 0 16px 48px #0006; }
    #tasty-result-title { margin: 0; font-size: 32px; }
    #tasty-result-copy { margin: 14px 0 22px; font-size: 16px; font-weight: 400; }
    #tasty-replay { border: 0; border-radius: 12px; padding: 14px 28px; background: #ffe39a; color: #39265d; font: inherit; cursor: pointer; touch-action: manipulation; }
    #tasty-replay:disabled { opacity: .65; cursor: wait; }
    @media (orientation: landscape) { #tasty-result { padding: 64px 20px 110px; } .tasty-result-card { padding: 12px 20px; } #tasty-result-title { font-size: 24px; } #tasty-result-copy { margin: 8px 0; } #tasty-replay { padding: 8px 24px; } }
    @media (orientation: landscape) { :root { --tasty-cta-space: 100px; } }
  </style>
</head>
