<!doctype html>
<html lang="en">
<head>
  <base href="../game/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#191b2d">
  <title>Escape Arrow · Level 2</title>
  <link rel="stylesheet" href="style.css">
  <script>window.__ESCAPE_ARROW_LEVEL__={"Index":2,"GridXSize":5,"GridYSize":5,"Arrows":[{"Indices":[22,17,16,15,10,5,0],"ColorIndex":0},{"Indices":[6,7,8,9,14],"ColorIndex":1},{"Indices":[11,12,13,18,23],"ColorIndex":2}]};</script>
  <script src="game.js" defer></script>
</head>
<body data-theme="night">
  <main id="game-shell">
    <header class="top-ui"><div class="hud-title"><strong id="hud-title-line1">Escape Arrow</strong><span id="hud-title-line2">Find a way. Set them free.</span></div></header>
    <div class="game-status"><span id="lives" aria-label="Lives remaining"></span><span id="progress" aria-live="polite"></span></div>
    <div id="board-wrap"><canvas id="board" aria-label="Tap an arrow to let it escape. Drag to pan and pinch to zoom."></canvas><img id="guide-hand" src="assets/guide-hand.png" alt="Tap an arrow" hidden><div id="toast" role="status" hidden></div></div>
    <nav class="game-toolbar" aria-label="Board tools"><button id="hint" type="button" aria-label="Hint: unlimited"><img id="hint-icon" src="assets/hint.png" alt=""><span id="hint-count" class="hint-count">∞</span></button><button id="zoom-out" type="button" aria-label="Zoom out">−</button><button id="recenter" type="button" aria-label="Center board">⌖</button><button id="zoom-in" type="button" aria-label="Zoom in">＋</button></nav>
    <div class="bottom-ui"><span id="instruction">Tap an arrow to set it free</span></div>
    <div id="result" class="result" hidden><div class="result-card"><div id="result-icon">✧</div><h1 id="result-title"></h1><p id="result-copy"></p><button id="result-reset" data-novvy-replay type="button">Play again</button></div></div>
  </main>
</body>
</html>
