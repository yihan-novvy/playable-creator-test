<!doctype html>
<html lang="zh-CN">
<head>
  <base href="../game/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#191b2d">
  <title>Escape Arrow · 第 11 关</title>
  <link rel="stylesheet" href="style.css">
  <script>window.__ESCAPE_ARROW_LEVEL__={"Index":11,"GridXSize":6,"GridYSize":8,"Arrows":[{"Indices":[25,26,27,28],"ColorIndex":0},{"Indices":[31,32,33,34],"ColorIndex":0},{"Indices":[19,20,21,22],"ColorIndex":0},{"Indices":[13,14,15,16],"ColorIndex":0},{"Indices":[7,8,9,10],"ColorIndex":0},{"Indices":[35,41,40,46,45,44,43,42,36,30,24,18,12,6,0,1],"ColorIndex":1}]};</script>
  <script src="game.js" defer></script>

<body data-theme="night">
  <main id="game-shell">
    <header class="top-ui"><div class="hud-title"><strong id="hud-title-line1">Escape Arrow</strong><span id="hud-title-line2">找到出口，让箭头自由</span></div></header>
    <div class="game-status"><span id="lives" aria-label="剩余生命"></span><span id="progress" aria-live="polite"></span><button id="sound" class="icon-button" type="button" aria-label="关闭声音">♪</button></div>
    <div id="board-wrap"><canvas id="board" aria-label="点击箭头，让它沿箭头方向逃出；拖动移动棋盘，双指缩放"></canvas><img id="guide-hand" src="assets/guide-hand.png" alt="点击箭头" hidden><div id="toast" role="status" hidden></div></div>
    <nav class="game-toolbar" aria-label="棋盘工具"><button id="hint" type="button">✧ 提示</button><button id="zoom-out" type="button" aria-label="缩小棋盘">−</button><button id="recenter" type="button" aria-label="棋盘回到中心">⌖</button><button id="zoom-in" type="button" aria-label="放大棋盘">＋</button><button id="theme" type="button" aria-label="切换明暗主题">☼</button></nav>
    <div class="bottom-ui"><span id="instruction">点击箭头，让它逃出</span></div>
    <div id="result" class="result" hidden><div class="result-card"><div id="result-icon">✧</div><h1 id="result-title"></h1><p id="result-copy"></p><button id="result-reset" type="button">再试一次</button></div></div>
  </main>
</body>
</html>
