    <title>Block Out! - Color Sort Puzzle</title>
    <style>
    * { padding: 0; margin: 0; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; }
    html, body {
      background-color: #1d2229;
      position: absolute;
      margin: 0; padding: 0;
      	top: 0;
        right: 0;
        left: 0;
        bottom: 0;
      overflow: hidden;
    }
    canvas { position: fixed; top: 0; left: 0; }
     body,
      html,
      canvas {
        touch-action: manipulation;
      }
    #preloader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, #25a2db 0%, #3359a8 80%);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 5rem;
    }
    #preloader img {
      width: 40%;
      height: auto;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .bar-loader {
      width: 60%; height: 4px;
      background: rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
      border-radius: 2px;
    }
    .bar-fill {
      position: absolute;
      top: 0; left: 0;
      width: 0%;
      height: 100%;
      background: white;
    }
    @media (orientation: portrait) {
      #preloader img { width: 40vw; height: auto; }
      .bar-loader { width: 50%; }
    }
    @media (orientation: landscape) {
      #preloader img { width: 25vw; height: auto; }
      .bar-loader { width: 36%; }
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
