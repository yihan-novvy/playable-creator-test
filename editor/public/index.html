<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可玩广告编辑器</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="row"><h1>可玩广告编辑器</h1><a href="/templates.html" class="primary">模板探索 ↗</a></div>
  <div id="env-chips" class="env-chips"></div>
</header>

<main class="container">
  <section class="card">
    <h2>新建任务</h2>
    <form id="create-form" class="row">
      <input id="task-name" type="text" placeholder="任务名,例如:Dragon Baby v2" required>
      <button type="submit" class="primary">创建</button>
    </form>
  </section>

  <section class="card">
    <h2>任务列表</h2>
    <div class="task-filters">
      <input id="task-filter-text" type="text" class="task-filter-text" placeholder="按任务名或模板过滤">
      <span class="task-filter-label">更新日期</span>
      <input id="task-filter-date" type="date" title="只看更新时间为这一天的任务">
      <button id="task-filter-clear" type="button" hidden>清除过滤</button>
      <span id="task-filter-count" class="hint"></span>
    </div>
    <table class="task-table">
      <thead>
        <tr><th>名称</th><th>模板</th><th>步骤状态</th><th>成品</th><th>更新时间</th><th></th></tr>
      </thead>
      <tbody id="task-rows"></tbody>
    </table>
    <p id="empty-hint" class="hint" hidden>还没有任务。先创建一个,然后上传素材、逐步预览、打包。</p>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
