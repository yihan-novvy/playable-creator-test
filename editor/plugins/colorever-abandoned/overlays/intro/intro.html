<div id="novvy-video-intro" class="novvy-video-intro" aria-label="__NOVVY_INTRO_ARIA__">
  <video
    id="novvy-intro-video"
    class="novvy-intro-video"
    playsinline
    webkit-playsinline
    preload="auto"
    poster="__NOVVY_INTRO_POSTER__"
  >
    <source src="__NOVVY_INTRO_VIDEO__" type="video/mp4">
  </video>
  <button id="novvy-intro-sound" class="novvy-intro-sound" type="button" aria-label="Mute sound" title="Mute sound"></button>
  <div id="novvy-intro-countdown" class="novvy-countdown" hidden aria-hidden="true"></div>
</div>
