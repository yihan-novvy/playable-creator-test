<!-- 自有下载卡(随包):初始 hidden,由转化桥 novvy:cta-card 事件点亮。
     按钮选择器(button.cta/.download/[data-novvy-cta]/[data-action=download])
     与落地页服务 hookCtaButtons、checkExistingEndCards 轮询对齐;整卡点击
     复用 Download,novvy:cta-interact 是无注入引擎时的转化桥兜底信号。
     data-novvy-click-source 供注入引擎 clickSource() 归因:卡内任意点击
     (closest 命中)记 cta_click,卡外点击才是 forced_click_to_appstore。 -->
<div id="novvy-cta" hidden aria-label="Download __CTA_NAME__" data-novvy-click-source="cta_click">
  <section class="novvy-cta-message" aria-label="体验引导">
    <div class="novvy-cta-message-text">__CTA_TAKEOVER_TEXT__</div>
    <div class="novvy-cta-message-action">__CTA_TAKEOVER_ACTION_TEXT__</div>
  </section>
  <section class="novvy-cta-card">
    <div class="novvy-cta-icon"><img src="__CTA_ICON__" alt=""></div>
    <div class="novvy-cta-details">
      <div class="novvy-cta-name">__CTA_NAME__</div>
      <div class="novvy-cta-rating"><span>★★★★★</span><small>4.8</small></div>
      <div class="novvy-cta-copy">__CTA_GUIDE_TEXT__</div>
    </div>
    <button id="novvy-cta-btn" class="novvy-cta-btn cta download" type="button" data-novvy-cta data-action="download"><span>__CTA_BUTTON_TEXT__</span></button>
  </section>
</div>
