<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>Travel Town · 原版剧情合并试玩</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#122a42}
    #travel-town-game{position:fixed;inset:0;touch-action:none}
    #travel-town-status{position:fixed;inset:40% 20px auto;text-align:center;color:white;font:16px Arial;pointer-events:none}
    #travel-town-result{position:fixed;inset:0;z-index:20;display:grid;place-items:center;box-sizing:border-box;padding:max(24px,var(--travel-town-hud-inset,0px)) max(20px,env(safe-area-inset-right)) max(24px,calc(var(--travel-town-cta-inset,0px) + 12px)) max(20px,env(safe-area-inset-left));background:#211840b8;color:#fff;text-align:center;font:700 20px/1.4 Arial,sans-serif;overflow:auto;overscroll-behavior:contain}
    #travel-town-result[hidden]{display:none}
    .travel-town-result-card{width:min(100%,300px);box-sizing:border-box;padding:28px 20px;border:2px solid #f6d992;border-radius:22px;background:#534095;box-shadow:0 16px 48px #0006}
    #travel-town-result-title{margin:0;font-size:32px;line-height:1.2}
    #travel-town-result-copy{margin:14px 0 22px;font-size:16px;font-weight:400}
    #travel-town-replay{border:0;border-radius:12px;padding:14px 28px;background:#ffe39a;color:#39265d;font:inherit;cursor:pointer;touch-action:manipulation;min-height:44px}
    #travel-town-replay:disabled{opacity:.65;cursor:wait}
    #travel-town-replay[hidden]{display:none}
    #travel-town-replay:focus-visible{outline:3px solid #fff;outline-offset:4px}
    @media (max-height:500px){.travel-town-result-card{padding:12px 20px}#travel-town-result-title{font-size:24px}#travel-town-result-copy{margin:8px 0;font-size:14px}#travel-town-replay{padding:8px 24px}}
  </style>
  <!--TRAVEL_TOWN_HEAD-->
</head>
<body>
  <div id="travel-town-game"></div>
  <p id="travel-town-status" role="status">Loading…</p>
  <div id="travel-town-result" role="dialog" aria-modal="true" aria-labelledby="travel-town-result-title" aria-describedby="travel-town-result-copy" tabindex="-1" hidden>
    <div class="travel-town-result-card">
      <h1 id="travel-town-result-title">You win!</h1>
      <p id="travel-town-result-copy" aria-live="polite">The room is looking better!</p>
      <button id="travel-town-replay" type="button">Retry</button>
    </div>
  </div>
  <!--TRAVEL_TOWN_SCRIPTS--><script>window.TRAVEL_TOWN_CONFIG={intro:false,title:false,allowReplay:true};</script><script src="host.js"></script><script src="game.js"></script><!--TRAVEL_TOWN_SCRIPTS_END-->
</body>
</html>
