<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>图案画室 · Colorever</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#25324b;font:14px system-ui}header{padding:22px 32px;border-bottom:1px solid #e1e6f0;background:white}h1{margin:0 0 8px;font-size:24px}p{line-height:1.6}header p{margin:0;color:#6d7891}main{max-width:1380px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:minmax(480px,1fr) 390px;gap:22px}.panel{padding:22px;border:1px solid #e1e6f0;border-radius:16px;background:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}button,select,input{font:inherit}button,select,input[type=text],input[type=number]{padding:9px 12px;border:1px solid #d8dfed;background:white;border-radius:8px;color:inherit}button{cursor:pointer}button:hover{border-color:#6b87d8}button:disabled{opacity:.4;cursor:default}button.active{background:#eaf0ff;border-color:#6381dd;color:#315ec1}.primary{background:#426cdb;color:white;border-color:#426cdb}.small{font-size:12px;color:#78849a}.badge{padding:5px 10px;border-radius:20px;background:#ecf3ff;color:#4567aa}.tools{margin:18px 0 12px}.palette{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.swatch-wrap{display:flex;align-items:center;border:1px solid #e0e5ef;border-radius:8px;padding:3px;gap:3px}.swatch{width:31px;height:31px;border-radius:6px;padding:0;box-shadow:inset 0 0 0 1px #0002}.swatch[aria-pressed=true]{outline:2px solid #426cdb;outline-offset:2px}input[type=color]{width:24px;height:28px;border:0;padding:0;background:none;cursor:pointer}.canvas-wrap{background:#eef2f8;border-radius:12px;padding:16px;overflow:auto;max-height:620px;border:1px solid #e3e8f0}canvas{display:block;margin:auto;touch-action:none;cursor:crosshair;background:#dbe2ed;box-shadow:0 5px 18px #263b5720}.canvas-footer{margin-top:10px}.inspector{margin-top:18px;border-top:1px solid #edf0f5;padding-top:16px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0}label.field{display:flex;flex-direction:column;gap:6px;color:#64718b}.field input{width:100%}details{margin-top:18px;border-top:1px solid #edf0f5;padding-top:14px}summary{cursor:pointer;font-weight:600}textarea{width:100%;height:260px;font:12px monospace;margin:12px 0;border:1px solid #d9e1ef;border-radius:8px;padding:12px}.preview-panel{align-self:start;position:sticky;top:20px}.preview-panel h2{font-size:18px;margin:0 0 14px}iframe{display:block;width:100%;height:615px;border:0;border-radius:12px;background:#e8f1fa;margin-top:14px}#status{min-height:23px;margin:8px 0;color:#64718b}#status.error{color:#c2474d}.save-row{margin-top:18px}#part-fields{display:none}.part-buttons{margin:10px 0}.hint{font-size:12px;color:#768299}.zoom{width:100px}@media(max-width:980px){main{grid-template-columns:1fr}.preview-panel{position:static}iframe{max-width:390px;margin:14px auto;height:698px}}@media(max-width:560px){main{padding:0 10px}.panel{padding:14px}header{padding:18px}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{min-width:0}.canvas-wrap{height:clamp(280px,70vh,620px);max-height:none}canvas{background:transparent}
</style></head><body><header><h1>图案画室</h1><p>绘制珠子格子，微调专属装饰。这里制作共享图案模板，保存到 colorever，build 后广告项目才能使用。</p></header>
<main><section class="panel"><div class="row spread"><label>图案模板 <select id="pattern" aria-label="图案模板"></select></label><span id="dirty" class="badge">已保存</span></div><p id="description" class="small"></p>
<div class="row tools" role="toolbar" aria-label="画布工具"><button data-tool="draw" class="active">画笔</button><button data-tool="erase">擦除</button><button data-tool="fill">填色</button><button data-tool="pick">吸色</button><button data-tool="move">移动装饰</button><button id="undo" disabled>撤销</button><button id="redo" disabled>重做</button></div>
<div id="palette" class="palette" aria-label="图案色板"></div><div class="canvas-wrap"><canvas id="board" aria-label="可编辑图案画布"></canvas></div>
<div class="row spread canvas-footer"><span id="cell-info" class="small"></span><label class="small">画布缩放 <input id="zoom" class="zoom" type="range" min="65" max="170" value="100" aria-label="画布缩放"> <output id="zoom-value" for="zoom">100%</output>（100% 适配全图）</label><label class="small"><input id="show-parts" type="checkbox" checked> 显示装饰</label></div>
<div class="inspector"><strong>专属装饰</strong><p class="hint">选择下方装饰后，可在画布拖动位置，也可精确调整偏移与大小。</p><div id="parts" class="row part-buttons"></div><div id="part-fields" class="fields"><label class="field">横向偏移（格）<input id="offsetX" type="number" min="-40" max="40" step="0.1"></label><label class="field">纵向偏移（格）<input id="offsetY" type="number" min="-40" max="40" step="0.1"></label><label class="field">大小倍数<input id="part-scale" type="number" min="0.1" max="4" step="0.05"></label></div><button id="reset-part" hidden>恢复选中装饰</button></div>
<details><summary>演示开局参数（广告任务在广告编辑器中另行设置开局）</summary><div class="row" style="margin-top:14px"><label class="field">开局模式<select id="opening-mode" aria-label="开局模式"><option value="easy">简易模式 · 整块搬运</option><option value="medium">适中模式 · 小块搬运</option><option value="scattered">零散模式 · 碎块归位</option></select></label></div><p id="mode-hint" class="hint"></p><div class="fields"><label class="field">图案名称<input id="name" type="text"></label><label class="field">格子列数<input id="width" type="number" min="4" max="40"></label><label class="field">格子行数<input id="height" type="number" min="4" max="40"></label><label class="field">篮子行数<input id="trayRows" type="number" min="1" max="6" value="4"></label><label class="field">篮子列数<input id="trayCols" type="number" min="4" max="16" value="12"></label><label id="difficulty-field" class="field">打散对数<input id="difficulty" type="number" min="1" max="100"></label><label class="field">随机种子<input id="seed" type="number" min="0" max="2147483647"></label></div><button id="shuffle">重新生成演示开局</button></details>
<details id="advanced"><summary>高级：JSON 导入与导出</summary><p class="hint">日常编辑使用画布和控件即可。创建新的专属装饰仍由该图案的 JS 模块完成。</p><textarea id="json" aria-label="图案模板 JSON"></textarea><div class="row"><button id="apply-json">应用 JSON 到画布</button><button id="export">导出图案 JSON</button></div><p id="module" class="hint"></p></details>
<div class="row save-row"><button id="save" class="primary">保存图案模板</button><button id="reload">放弃修改并重新读取</button></div><p id="status" role="status"></p></section>
<section class="panel preview-panel"><h2>真实游戏预览</h2><div class="row"><button id="completed" class="active">完整拼图</button><button id="play">试玩开局</button></div><iframe id="preview" title="图案模板预览" allow="autoplay"></iframe><p id="preview-state" class="hint">正在加载…</p><p class="hint">编辑自动预览草稿；点击保存后才更新共享模板，再运行 build:template 导出给广告项目。</p></section></main><script src="/editor/app.js"></script></body></html>
