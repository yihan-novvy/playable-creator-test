<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Colorever · 珠子材质对比</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf3f7;color:#263746;font-family:Arial,"PingFang SC",sans-serif}main{max-width:1000px;margin:auto;padding:26px}h1{font-size:23px;margin:0 0 8px}p{font-size:14px;margin:0 0 20px;color:#647788}.panel{border-radius:20px;padding:18px 24px;margin:16px 0;background:white;box-shadow:0 5px 24px #30475608}h2{font-size:15px;margin:0 0 10px}.samples{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.sample{text-align:center}.sample b{font-size:13px;display:block;margin-bottom:10px}.crop{width:170px;height:170px;max-width:100%;margin:auto;position:relative;overflow:hidden;border-radius:12px;background:#b5e4f8}.crop img{position:absolute;max-width:none;height:auto;width:4614.2857px}canvas{width:100%;aspect-ratio:900/210;display:block;border-radius:12px;background:#bde6f6}.note{display:flex;justify-content:space-around;margin-top:9px;color:#617686;font-size:12px}.small{aspect-ratio:900/160}a{color:#3a839e;font-size:14px;text-decoration:none}@media(max-width:600px){main{padding:15px}.panel{padding:16px 12px}.samples{gap:8px}.crop{width:100px;height:100px}.crop img{width:2714.2857px}.note{font-size:11px}}
.switch{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}.switch button{font:inherit;font-size:13px;padding:8px 14px;border:1px solid #d7e4eb;border-radius:20px;background:#f4f8fa;color:#4d697c;cursor:pointer}.switch button[aria-pressed=true]{background:#286881;color:#fff;border-color:#286881}.switch button:focus-visible{outline:2px solid #f5ad7d;outline-offset:3px}#center-description{margin:10px 0 0;font-size:12px}</style></head><body><main><h1>珠子造型重做</h1><p>降低柱身、缩窄上沿、减浅内壁。中心直接透出猫咪底图，可切换花朵底图验证透明。</p><section class="panel"><h2>参考图局部 · 原图直接放大</h2><div class="samples"><div class="sample"><b>黑色</b><div class="crop" data-x="780" data-y="934"><img src="./reference-kitty-source.png" alt="参考图黑色珠子局部"></div></div><div class="sample"><b>白色</b><div class="crop" data-x="780" data-y="1280.5"><img src="./reference-kitty-source.png" alt="参考图白色珠子局部"></div></div><div class="sample"><b>粉色</b><div class="crop" data-x="487.4" data-y="1181.5"><img src="./reference-kitty-source.png" alt="参考图粉色珠子局部"></div></div></div></section><section class="panel"><h2>上一版 · 厚圆环</h2><canvas id="before" aria-label="调整前三颗珠子"></canvas><div class="note"><span>圆环偏厚</span><span>内壁过深</span><span>凹槽感明显</span></div></section><section class="panel"><h2>新的浅圆柱 · 薄圆润上沿</h2><div class="switch" role="group" aria-label="底图"><button type="button" data-background="cat" aria-pressed="true">猫咪底图局部</button><button type="button" data-background="flower" aria-pressed="false">花朵底图 · 查看透明</button></div><div class="switch" role="group" aria-label="中心材质"><button type="button" data-center-mode="matte" aria-pressed="false">透明开口</button><button type="button" data-center-mode="glass" aria-pressed="true">薄玻璃反光</button></div><canvas id="after" aria-label="优化后的黑白粉珠子"></canvas><div class="note"><span>薄圆角与局部亮弧</span><span>中心材质可切换</span><span>低柱身与柔和阴影</span></div><p id="center-description" aria-live="polite"></p></section><section class="panel"><h2>缩小后的拼排效果</h2><canvas class="small" id="cluster" aria-label="优化后小尺寸珠子拼排"></canvas></section
